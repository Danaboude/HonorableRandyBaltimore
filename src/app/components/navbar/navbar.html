<nav class="fixed w-full z-50 transition-all duration-300" [class.glass]="isScrolled" [class.bg-transparent]="!isScrolled" [class.py-2]="isScrolled" [class.py-4]="!isScrolled">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="flex justify-between items-center">
      <!-- Logo -->
      <a href="#" (click)="closeMobileMenu()" class="flex-shrink-0 flex items-center gap-3 group z-50 relative">
        <img src="logo.png" alt="ABLP Logo" class="h-10 w-auto transition-transform group-hover:scale-105 duration-300">
        <div class="flex flex-col">
          <span class="font-outfit font-bold text-xl leading-tight text-slate-900 group-hover:text-[#da291c] transition-colors">Randy</span>
          <span class="font-outfit font-bold text-xl leading-tight text-[#da291c]">Baltimore</span>
        </div>
      </a>
      
      <!-- Desktop Menu -->
      <div class="hidden md:flex space-x-8 items-center">
        <a href="#about" class="text-slate-800 hover:text-[#da291c] font-medium transition-colors">About</a>
        <a href="#news" class="text-slate-800 hover:text-[#da291c] font-medium transition-colors">Press</a>
        <a href="#election" class="text-slate-800 hover:text-[#da291c] font-medium transition-colors">By-Election</a>
        <a href="#contact" class="px-6 py-2 bg-[#da291c] text-white rounded-full font-medium hover:bg-[#b90000] transition-colors shadow-lg shadow-red-500/30">Support Us</a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center z-50 relative">
        <button (click)="toggleMobileMenu()" type="button" class="text-slate-800 hover:text-[#da291c] focus:outline-none p-2 rounded-md transition-colors" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          @if (!isMobileMenuOpen) {
            <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div class="md:hidden transition-all duration-300 ease-in-out absolute w-full top-full left-0 bg-white shadow-2xl border-t border-slate-100 overflow-hidden origin-top" 
       [class.scale-y-100]="isMobileMenuOpen" 
       [class.opacity-100]="isMobileMenuOpen"
       [class.scale-y-0]="!isMobileMenuOpen" 
       [class.opacity-0]="!isMobileMenuOpen">
    <div class="px-4 pt-4 pb-8 space-y-3 flex flex-col">
      <a href="#about" (click)="closeMobileMenu()" class="block px-3 py-3 rounded-md text-base font-semibold text-slate-800 hover:text-[#da291c] hover:bg-red-50 transition-colors">About</a>
      <a href="#news" (click)="closeMobileMenu()" class="block px-3 py-3 rounded-md text-base font-semibold text-slate-800 hover:text-[#da291c] hover:bg-red-50 transition-colors">Press</a>
      <a href="#election" (click)="closeMobileMenu()" class="block px-3 py-3 rounded-md text-base font-semibold text-slate-800 hover:text-[#da291c] hover:bg-red-50 transition-colors">By-Election</a>
      <div class="pt-4 border-t border-slate-100">
        <a href="#contact" (click)="closeMobileMenu()" class="block text-center w-full px-6 py-3 bg-[#da291c] text-white rounded-full font-bold hover:bg-[#b90000] shadow-md transition-colors">Support Us</a>
      </div>
    </div>
  </div>
</nav>
