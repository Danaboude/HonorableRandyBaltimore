<section class="relative min-h-screen flex items-center pt-20 overflow-hidden bg-white">
  <!-- Dynamic Background Element -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-y-0 right-0 w-1/2 bg-[#da291c] rounded-bl-[100px] origin-top-right transform" appScrollAnimate></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full py-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      
      <!-- Text Content -->
      <div class="space-y-8" appScrollAnimate>
        <div class="inline-block px-4 py-2 bg-red-100 text-[#da291c] font-semibold rounded-full">
          Member of the House of Representatives
        </div>
        
        <h1 class="text-5xl md:text-7xl font-bold font-outfit text-slate-900 leading-tight">
          Honorable<br/>
          <span class="text-[#da291c]">Randy Baltimore</span>
        </h1>
        
        <p class="text-xl text-slate-600 font-inter max-w-lg leading-relaxed">
          Proudly serving the people of St. Philip's North. Dedicated to the vision of the Antigua and Barbuda Labour Party.
        </p>
        
        <div class="flex flex-wrap gap-4">
          <a href="#about" class="px-8 py-4 bg-[#da291c] text-white rounded-full font-bold hover:bg-[#b90000] transition-all hover:scale-105 shadow-xl shadow-red-500/40">
            Read Biography
          </a>
          <a href="#contact" class="px-8 py-4 bg-white text-slate-900 rounded-full font-bold border border-slate-200 hover:bg-slate-50 transition-all hover:scale-105 shadow-md">
            Get in Touch
          </a>
        </div>
      </div>

      <!-- Image Column -->
      <div class="relative" appScrollAnimate>
        <!-- Floating Glass Card -->
        <div class="absolute inset-x-4 md:inset-x-auto md:-left-16 -top-8 md:top-1/4 glass p-4 md:p-6 rounded-2xl z-20 max-w-sm mx-auto shadow-lg" appScrollAnimate>
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-[#da291c] flex items-center justify-center text-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <p class="text-sm text-slate-500 font-medium">Elected</p>
              <p class="text-lg font-bold text-slate-900 font-outfit">March 2026</p>
            </div>
          </div>
        </div>

        <div class="relative w-full aspect-[4/5] md:aspect-[3/4] rounded-3xl overflow-hidden shadow-2xl border-8 border-white">
          <img src="Honorable Randy Baltimore_1.png" alt="Honorable Randy Baltimore" class="object-cover w-full h-full object-top" />
        </div>
        
        <!-- Decorative subtle pattern -->
        <div class="absolute -bottom-6 -right-6 w-32 h-32 bg-slate-100 rounded-full mix-blend-multiply opacity-50 z-0"></div>
      </div>

    </div>
  </div>
</section>
